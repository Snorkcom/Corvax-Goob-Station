# Chat highlight autofill presets for the en-US locale.
# IDs use the job prototype ID plus a locale suffix so this file can coexist with the other locale file.
# Add localized aliases to words, for example: words: ["Captain", "Cap", "Commander"].
# Use rawWords for values that must be inserted without double quotes, for example: rawWords: ["cap"].

