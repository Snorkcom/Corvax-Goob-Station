- type: entity
  parent: BaseSign
  id: BaseCarvedWoodMedallionFrame
  abstract: true
  name: carved wood medallion frame
  description: A metal mounting frame for a carved wood medallion. Use a crowbar to change its shape before adding wood.
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Structures/Furniture/carved_wood_medallion.rsi
    drawdepth: WallMountedItems
    snapCardinals: false
    noRot: true
  - type: Transform
    anchored: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: PhysicalComposition
    materialComposition:
      Steel: 50
  - type: StaticPrice
    price: 5
  - type: Tag
    tags:
    - Structure

- type: entity
  parent: BaseCarvedWoodMedallionFrame
