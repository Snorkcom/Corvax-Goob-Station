# carved-wood-medallion
- type: entity
  parent: BaseSign
  id: BaseCarvedWoodMedallion
  abstract: true
  name: carved wood medallion
  description: A hand-carved wooden display shield for a single cherished trophy.
  components:
  - type: Sprite
    sprite: _CorvaxGoob/Structures/Furniture/carved_wood_medallion.rsi
    drawdepth: WallMountedItems
    snapCardinals: false
    noRot: true
  - type: Transform
    anchored: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 35
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          MaterialWoodPlank1:
            min: 2
            max: 3
          PartRodMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ItemSlots
    slots:
      display_slot:
        ejectOnBreak: true
        whitelist:
          components:
          - Item
        blacklist:
          components:
          - Explosive
          - Storage
          - ContainerContainer
          - EntityStorage
          - MobState
          sizes:
          - Large
          - Huge
          - Ginormous
  - type: ItemSlotRenderer
    renderTargetSize: 32,32
    centerItemByContentBounds: true
    mapping:
      display_slot: display
  - type: ContainerContainer
    containers:
      display_slot: !type:ContainerSlot {}
  - type: PhysicalComposition
    materialComposition:
      Wood: 300
  - type: StaticPrice
    price: 15
  - type: Tag
    tags:
    - Structure
    - Wooden

- type: entity
  parent: BaseCarvedWoodMedallion
  id: CarvedWoodMedallion
  suffix: Elliptic
  components:
  - type: Sprite
    layers:
    - state: medallion_elliptic
    - map: ["display"]
  - type: ItemSlotRenderer
    renderOffsets:
      display_slot: 0,0
  - type: Construction
    graph: CarvedWoodMedallionGraph
    node: medallionElliptic

