# carved-wood-medallion
- type: constructionGraph
  id: CarvedWoodMedallionGraph
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: frameElliptic
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: MetalRod
              amount: 1
              doAfter: 1

    - node: frameElliptic
      entity: CarvedWoodMedallionFrame
      edges:
        - to: frameShieldDark
          steps:
            - tool: Prying
              doAfter: 1
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: PartRodMetal1
              amount: 1
          steps:
            - tool: Cutting
              doAfter: 1
        - to: medallionElliptic
          steps:
            - material: WoodPlank
              amount: 3
              doAfter: 3

    - node: frameShieldDark
      entity: CarvedWoodMedallionFrameShieldDark
      edges:
