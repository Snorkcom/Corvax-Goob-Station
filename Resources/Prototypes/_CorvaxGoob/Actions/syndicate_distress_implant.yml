- type: entity
  parent: BaseMentalAction
  id: ActionActivateSyndicateDistressImplant
  name: Transmit distress signal
  description: Sends your real name and current position over the Syndicate channel. Works even in critical condition.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    useDelay: 90
    icon:
      sprite: _Goobstation/Objects/Specific/Security/panicbutton.rsi
      state: icon
  - type: InstantAction
    event: !type:SyndicateDistressImplantActionEvent
